version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: openemr
images:
  - id: openemr
    target: service
    service: openemr
    source: openemr/openemr
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  # mariadb 12.x is three-segment (12.3.3): custom channel locks the major line
  - id: mariadb
    target: service
    service: openemr-db
    source: library/mariadb
    channel: custom
    sort: semver
    tag_regex: ^12[.][0-9]+[.][0-9]+$
    version_regex: ^(?P<version>12[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: openemr
    skip_if_version_exists: true
