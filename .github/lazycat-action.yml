version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: openemr
build:
  toolchains:
    - kind: docker
  run_buildscript: false
images:
  # ghcr image: source must be the full path (watcharr precedent)
  - id: bitmagnet
    target: service
    service: bitmagnet
    source: ghcr.io/bitmagnet-io/bitmagnet
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  # postgres 16.x tags are two-segment (16.9): custom + version_regex + template pads to three
  - id: postgres
    target: service
    service: bitmagnet-db
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: ^16[.][0-9]+$
    version_regex: ^(?P<version>16[.][0-9]+)$
    version_template: "{version}.0"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: bitmagnet
    skip_if_version_exists: true
