application:
  subdomain: openemr
  multi_instance: false
  # 应用首启由容器自动完成安装（MANUAL_SETUP=no），初始管理员账号为 admin +
  # 部署参数里预置的随机密码（oe_admin），无自助注册入口；
  # 参照 part-db 判例：不加 public_path，由平台入口鉴权防护，登录后请立即改密。
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://openemr:80/
services:
  openemr:
    # upstream: openemr/openemr:8.6.0
    image: docker.1ms.run/openemr/openemr:8.6.0
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_HOST=openemr-db
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASS={{PASSWORD_oe_db_root}}
      - MYSQL_USER=openemr
      - MYSQL_PASS={{PASSWORD_oe_db}}
      - MYSQL_DATABASE=openemr
      - OE_USER=admin
      - OE_PASS={{PASSWORD_oe_admin}}
    binds:
      - /lzcapp/var/data:/var/www/localhost/htdocs/openemr/sites
    depends_on:
      - openemr-db
  openemr-db:
    # upstream: library/mariadb:12.3.3
    image: docker.1ms.run/library/mariadb:12.3.3
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      - TZ=Asia/Shanghai
      - MARIADB_ROOT_PASSWORD={{PASSWORD_oe_db_root}}
      - MARIADB_AUTO_UPGRADE=1
    binds:
      - /lzcapp/var/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m
usage: |
  OpenEMR 是全球广泛使用的开源电子病历（EHR）与门诊管理系统，
  提供患者档案、预约、处方、计费与报表等功能。

  使用方法：
  1. 安装后首次启动会自动完成数据库初始化与应用安装（约需几分钟），
     请耐心等待服务就绪后再访问。
  2. 初始管理员账号：admin，密码为部署参数「管理员密码」中预置的随机值，
     请在应用内立即修改为自己的密码。
  3. 数据库与应用数据分别存放在 /lzcapp/var/db 与 /lzcapp/var/data，
     升级前请做好备份。

  说明：
  - 本包未做实机验证，功能以官方文档为准：https://www.open-emr.org/wiki/
  - 许可为 GPL-3.0，全文随包附带，见 /package-licenses/。
