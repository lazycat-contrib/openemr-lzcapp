params:
  - id: oe_db_root
    type: secret
    name: "数据库 root 密码"
    description: "MariaDB root 密码（已预置随机值，应用自动使用）"
    default_value: "tR4wVe8mQx1pLzK6"
    optional: false
  - id: oe_db
    type: secret
    name: "数据库密码"
    description: "OpenEMR 业务数据库密码（已预置随机值，应用自动使用）"
    default_value: "hJ9cNu3aBw5sYe2f"
    optional: false
  - id: oe_admin
    type: secret
    name: "管理员密码"
    description: "OpenEMR 初始管理员 admin 的登录密码（已预置随机值，安装后可在应用内修改）"
    default_value: "qW7kXb0eMz4tRv8j"
    optional: false

